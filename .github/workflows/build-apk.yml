name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (mis. v1.1.0)'
        required: true
      publish:
        description: 'Publish sebagai GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Setup Android SDK dari nol
        run: |
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"

          # Download Android command-line tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          # Install semua komponen ke SDK_DIR kita sendiri.
          # NDK harus versi yang mendukung API 34 (NDK 25 hanya sampai API 33):
          # cargo-apk membuang platform di luar rentang NDK_MIN..NDK_MAX_PLATFORM_LEVEL
          # dan gagal dengan "Android SDK has no platforms installed".
          yes | $SDKMANAGER --sdk_root="$SDK_DIR" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;26.3.11579264"

          # Verifikasi hasil install
          echo "=== platforms ===" && ls "$SDK_DIR/platforms/"
          echo "=== build-tools ===" && ls "$SDK_DIR/build-tools/"
          echo "=== ndk ===" && ls "$SDK_DIR/ndk/"
          test -f "$SDK_DIR/platforms/android-34/android.jar" || {
            echo "platform android-34 tidak terpasang — pastikan NDK mendukung API 34"; exit 1;
          }

          # Override env vars ke lokasi kita — ini yang dibaca cargo-apk
          echo "ANDROID_HOME=$SDK_DIR"                          >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR"                     >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK_DIR/ndk/26.3.11579264"   >> $GITHUB_ENV

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Siapkan keystore release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Secret KEYSTORE_BASE64 dan KEYSTORE_PASSWORD wajib diisi. Lihat README bagian Rilis APK." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK (release)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: cargo apk build --release --lib

      - name: Cari file APK
        id: find_apk
        run: |
          APK_PATH="target/release/apk/NoIklan.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK tidak ditemukan di $APK_PATH" >&2
            ls -R target/release/apk || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK ditemukan di: $APK_PATH"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoIklan-APK
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Buat GitHub Release & upload APK
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "NoIklan ${{ inputs.tag || github.ref_name }}"
          body: |
            ## NoIklan ${{ inputs.tag || github.ref_name }}

            Aplikasi YouTube tanpa iklan untuk Android, ditulis dalam Rust.

            ### Yang baru
            - UI mengikuti YouTube: beranda rekomendasi, pencarian, Shorts, langganan, library
            - Data asli dari YouTube (trending + pencarian) dan thumbnail asli
            - Pemutaran lewat Brave dengan Shields aktif; fallback ke browser default

            ### Cara Install
            1. Download file `NoIklan.apk` di bawah
            2. Buka file APK di HP Android kamu
            3. Izinkan install dari sumber tidak dikenal jika diminta
            4. Install lalu buka aplikasi

            ### Catatan
            - Pemutaran video via Brave (ad-block native)
            - Fallback ke browser default jika Brave tidak terpasang
            - Min Android: 7.0 (API 24)
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
